<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1728">
<title>Caçador IA V1</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0d1728;
  color:#fff;
}
.container{
  width:min(680px,94%);
  margin:0 auto;
  padding:38px 0 50px;
}
.header{text-align:center;margin-bottom:28px}
.logo{font-size:44px}
h1{font-size:36px;margin:8px 0 4px}
.subtitle{font-size:20px;color:#aeb8c9}
.card{
  background:#172338;
  border-radius:28px;
  padding:26px;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
}
label{
  display:block;
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}
input{
  width:100%;
  padding:18px 20px;
  border:0;
  border-radius:17px;
  font-size:19px;
  outline:none;
  margin-bottom:16px;
}
button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:18px;
  background:#20c979;
  color:#fff;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}
button:active{transform:scale(.99)}
button:disabled{opacity:.65;cursor:wait}
.status{
  text-align:center;
  color:#b9c4d5;
  margin:18px 0 0;
  min-height:24px;
}
.result{
  margin-top:24px;
  display:none;
}
.result.show{display:block}
.result-title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:15px;
}
.match-name{
  font-size:22px;
  font-weight:bold;
  margin-bottom:16px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.info{
  background:#0f1b2d;
  border-radius:15px;
  padding:14px;
}
.info small{
  display:block;
  color:#9eabc0;
  margin-bottom:5px;
}
.info strong{font-size:16px}
.analysis{
  margin-top:16px;
  background:#0f1b2d;
  border-radius:18px;
  padding:17px;
  line-height:1.55;
}
.analysis h3{margin:0 0 8px}
.warning{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:#2a2230;
  color:#f1c8df;
  line-height:1.45;
}
.footer{
  text-align:center;
  color:#8290a7;
  font-size:13px;
  margin-top:22px;
  line-height:1.5;
}
.spinner{
  display:inline-block;
  width:16px;
  height:16px;
  border:3px solid #718099;
  border-top-color:#20c979;
  border-radius:50%;
  animation:spin .8s linear infinite;
  vertical-align:middle;
  margin-right:7px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){
  .container{padding-top:26px}
  h1{font-size:31px}
  .logo{font-size:38px}
  .grid{grid-template-columns:1fr}
  .card{padding:20px}
}
</style>
</head>

<body>
<div class="container">

  <div class="header">
    <div class="logo">🎯</div>
    <h1>CAÇADOR IA</h1>
    <div class="subtitle">Analisador de jogos V1</div>
  </div>

  <div class="card">
    <label for="jogo">Digite o nome do jogo</label>
    <input
      id="jogo"
      type="text"
      autocomplete="off"
      placeholder="Ex.: Manchester United vs Newcastle"
      onkeydown="if(event.key==='Enter') analisarJogo()"
    >

    <button id="btn" onclick="analisarJogo()">🔍 ANALISAR JOGO</button>

    <div id="status" class="status"></div>

    <div id="resultado" class="result">
      <div class="result-title">📊 Resultado da análise</div>
      <div id="nomeJogo" class="match-name"></div>

      <div class="grid">
        <div class="info">
          <small>Competição</small>
          <strong id="competicao">—</strong>
        </div>
        <div class="info">
          <small>Data</small>
          <strong id="data">—</strong>
        </div>
        <div class="info">
          <small>Estado</small>
          <strong id="estado">—</strong>
        </div>
        <div class="info">
          <small>Local</small>
          <strong id="local">—</strong>
        </div>
      </div>

      <div class="analysis">
        <h3>🎯 Leitura do Caçador</h3>
        <div id="leitura"></div>
      </div>

      <div id="aviso" class="warning" style="display:none"></div>
    </div>

    <div class="footer">
      O Caçador V1 usa dados encontrados online. Quando não houver
      dados suficientes, ele informa isso em vez de inventar uma previsão.
    </div>
  </div>
</div>

<script>
const API_BASE = "https://www.thesportsdb.com/api/v1/json/123";

function limparTexto(texto){
  return texto.replace(/\s+/g," ").trim();
}

function separarJogo(texto){
  const original = limparTexto(texto);

  const separadores = [
    /\s+vs\.?\s+/i,
    /\s+v\s+/i,
    /\s+x\s+/i,
    /\s+-\s+/i
  ];

  for(const sep of separadores){
    const partes = original.split(sep);
    if(partes.length >= 2){
      return {
        casa: partes[0].trim(),
        fora: partes.slice(1).join(" ").trim(),
        original
      };
    }
  }

  return {casa:"", fora:"", original};
}

function formatarData(data){
  if(!data) return "Não disponível";
  const d = new Date(data + "T00:00:00");
  if(isNaN(d)) return data;
  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function formatarHora(hora){
  if(!hora) return "";
  return hora.substring(0,5);
}

function estadoJogo(evento){
  const status = (evento.strStatus || "").trim();
  const date = evento.dateEvent || "";
  const time = formatarHora(evento.strTime);

  if(status) return status;
  if(evento.intHomeScore !== null && evento.intHomeScore !== undefined)
    return "Resultado disponível";

  if(date){
    const inicio = new Date(date + "T" + (time || "00:00"));
    if(!isNaN(inicio.getTime())){
      if(inicio > new Date()) return "Agendado";
      return "Data passada";
    }
  }

  return "Informação disponível";
}

function gerarLeitura(evento){
  const casa = evento.strHomeTeam || "Equipa da casa";
  const fora = evento.strAwayTeam || "Equipa visitante";
  const status = estadoJogo(evento);

  let texto = "";

  texto += "O Caçador encontrou um registo para <b>" +
           casa + " vs " + fora + "</b>. ";

  if(evento.strLeague){
    texto += "O jogo está associado à competição <b>" +
             evento.strLeague + "</b>. ";
  }

  if(evento.strCountry){
    texto += "País/região: <b>" + evento.strCountry + "</b>. ";
  }

  if(status.toLowerCase().includes("agend")){
    texto += "O registo indica que o jogo está <b>agendado</b>. ";
    texto += "Nesta V1, o Caçador não transforma apenas o nome das equipas numa certeza de vitória.";
  }else if(evento.intHomeScore !== null && evento.intHomeScore !== undefined){
    texto += "Existe resultado registado: <b>" +
             evento.intHomeScore + " - " +
             evento.intAwayScore + "</b>. ";
    texto += "O resultado encontrado é apresentado como dado, não como previsão.";
  }else{
    texto += "Há informação do evento, mas não há dados suficientes neste registo para apresentar uma previsão confiável.";
  }

  return texto;
}

function mostrarErro(mensagem){
  const resultado = document.getElementById("resultado");
  const aviso = document.getElementById("aviso");
  const leitura = document.getElementById("leitura");

  resultado.classList.add("show");
  document.getElementById("nomeJogo").textContent = "";
  document.getElementById("competicao").textContent = "—";
  document.getElementById("data").textContent = "—";
  document.getElementById("estado").textContent = "Não encontrado";
  document.getElementById("local").textContent = "—";

  leitura.innerHTML = mensagem;
  aviso.style.display = "block";
  aviso.innerHTML =
    "⚠️ O Caçador não encontrou dados suficientes para este nome. " +
    "Tente escrever os nomes completos, por exemplo: " +
    "<b>Manchester United vs Newcastle</b>.";
}

async function analisarJogo(){
  const input = document.getElementById("jogo");
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const resultado = document.getElementById("resultado");
  const aviso = document.getElementById("aviso");

  const texto = limparTexto(input.value);

  if(!texto){
    input.focus();
    status.textContent = "Digite primeiro o nome do jogo.";
    resultado.classList.remove("show");
    return;
  }

  const partes = separarJogo(texto);

  if(!partes.casa || !partes.fora){
    resultado.classList.add("show");
    document.getElementById("nomeJogo").textContent = texto;
    document.getElementById("leitura").innerHTML =
      "Para a V1 encontrar o jogo com maior facilidade, escreva no formato " +
      "<b>Equipa A vs Equipa B</b>.";
    aviso.style.display = "block";
    aviso.innerHTML =
      "Exemplo: <b>Manchester United vs Newcastle</b>";
    status.textContent = "";
    return;
  }

  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span>A procurar o jogo...';
  resultado.classList.remove("show");
  aviso.style.display = "none";

  try{
    const nomeBusca = encodeURIComponent(
      partes.casa + "_vs_" + partes.fora
    );

    const url = API_BASE + "/searchevents.php?e=" + nomeBusca;

    const resposta = await fetch(url);

    if(!resposta.ok){
      throw new Error("Falha na ligação");
    }

    const dados = await resposta.json();
    const eventos = dados.events || [];

    if(!eventos.length){
      mostrarErro(
        "Não encontrei um evento correspondente ao nome informado."
      );
      status.textContent = "";
      return;
    }

    const evento = eventos[0];

    document.getElementById("nomeJogo").textContent =
      (evento.strHomeTeam || partes.casa) +
      " vs " +
      (evento.strAwayTeam || partes.fora);

    document.getElementById("competicao").textContent =
      evento.strLeague || "Não disponível";

    let dataTexto = formatarData(evento.dateEvent);
    const hora = formatarHora(evento.strTime);
    if(hora) dataTexto += " • " + hora;

    document.getElementById("data").textContent = dataTexto;

    document.getElementById("estado").textContent =
      estadoJogo(evento);

    const local = evento.strVenue ||
                  evento.strCity ||
                  "Não disponível";

    document.getElementById("local").textContent = local;

    document.getElementById("leitura").innerHTML =
      gerarLeitura(evento);

    if(evento.intHomeScore !== null &&
       evento.intHomeScore !== undefined){
      aviso.style.display = "block";
      aviso.innerHTML =
        "ℹ️ Resultado registado na fonte: <b>" +
        evento.intHomeScore + " - " +
        evento.intAwayScore + "</b>.";
    }else{
      aviso.style.display = "none";
    }

    resultado.classList.add("show");
    status.textContent = "Jogo encontrado.";

  }catch(erro){
    console.error(erro);

    resultado.classList.add("show");
    document.getElementById("nomeJogo").textContent = texto;
    document.getElementById("leitura").innerHTML =
      "Não foi possível consultar os dados neste momento.";
    aviso.style.display = "block";
    aviso.innerHTML =
      "⚠️ Verifique a ligação à internet e tente novamente.";
    status.textContent = "";
  }finally{
    btn.disabled = false;
  }
}
</script>
</body>
</html>
