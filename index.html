/* =========================================================
   NORMALIZAÇÃO
========================================================= */

function normalizar(txt){

  return (txt || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/&/g," and ")
    .replace(/[^a-z0-9]+/g," ")
    .replace(/\b(fc|cf|sc|afc|club|football|futebol)\b/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================================================
   SEPARAR JOGO
========================================================= */

function separarJogo(txt){

  let s = txt.trim();

  const partes =
    s.split(/\s+(?:vs?|x)\s+|\s+-\s+/i);

  if(partes.length >= 2){

    return [
      partes[0].trim(),
      partes.slice(1).join(" - ").trim()
    ];

  }

  return [s,""];

}


/* =========================================================
   COMPARAR NOMES
========================================================= */

function nomesCombinam(a,b){

  const A = normalizar(a);

  const B = normalizar(b);

  if(!A || !B)
    return false;

  if(A === B)
    return true;

  if(A.includes(B) || B.includes(A))
    return true;

  const ta =
    new Set(A.split(" ").filter(x=>x.length>2));

  const tb =
    new Set(B.split(" ").filter(x=>x.length>2));

  let comuns = 0;

  ta.forEach(x=>{

    if(tb.has(x))
      comuns++;

  });

  return comuns >= 1 &&
         (ta.size <= 3 || tb.size <= 3);

}


/* =========================================================
   EVENTO COMBINA
========================================================= */

function eventoCombina(ev,casa,fora){

  const h = ev.strHomeTeam || "";

  const a = ev.strAwayTeam || "";

  if(casa && fora){

    return (

      nomesCombinam(casa,h) &&
      nomesCombinam(fora,a)

    ) ||

    (

      nomesCombinam(casa,a) &&
      nomesCombinam(fora,h)

    );

  }

  const alvo = normalizar(casa);

  return nomesCombinam(alvo,h) ||
         nomesCombinam(alvo,a);

}


/* =========================================================
   DATA
========================================================= */

function formatarData(ev){

  if(!ev.dateEvent)
    return "—";

  let d = ev.dateEvent;

  if(ev.strTime)
    d += " • " + ev.strTime.substring(0,5);

  return d;

}


/* =========================================================
   ESTADO
========================================================= */

function estadoEvento(ev){

  if(ev.strStatus)
    return ev.strStatus;

  if(
    ev.intHomeScore != null &&
    ev.intAwayScore != null
  ){

    return "Finalizado: " +
      ev.intHomeScore +
      " - " +
      ev.intAwayScore;

  }

  return "Agendado";

}

  $("data").textContent =
    formatarData(ev);

  $("estado").textContent =
    estadoEvento(ev);

  $("local").textContent =
    ev.strVenue || "—";

  else{

  }


  $("leitura").textContent =
    leitura;

}


/* =========================================================
   PEDIDO JSON
========================================================= */

async function getJSON(url){

  const r =
    await fetch(url);

  if(!r.ok)
    throw new Error("HTTP " + r.status);

  return await r.json();

}


/* =========================================================
   PROCURAR POR NOME
========================================================= */

async function procurarPorNome(casa,fora){

  const variantes = [];

  if(casa && fora){

    variantes.push(
      casa + "_vs_" + fora
    );

    variantes.push(
      fora + "_vs_" + casa
    );

    variantes.push(
      casa + " vs " + fora
    );

    variantes.push(
      fora + " vs " + casa
    );

  }else{

    variantes.push(casa);

  }


  for(const v of variantes){

    try{

      const data =
        await getJSON(
          API +
          "/searchevents.php?e=" +
          encodeURIComponent(
            v.replace(/\s+/g,"_")
          )
        );

      const lista =
        data.events || [];

      const achado =
        lista.find(
          ev =>
            eventoCombina(
              ev,
              casa,
              fora
            )
        );

      if(achado)
        return achado;

    }catch(e){}

  }

  return null;

}


/* =========================================================
   DATA ISO
========================================================= */

function dataISO(offset){

  const d =
    new Date();

  d.setDate(
    d.getDate() + offset
  );

  return d
    .toISOString()
    .slice(0,10);

}


/* =========================================================
   PROCURAR POR DIAS
========================================================= */

async function procurarPorDias(casa,fora){

  for(let i=0;i<=7;i++){

    const dia =
      dataISO(i);

    try{

      const data =
        await getJSON(
          API +
          "/eventsday.php?d=" +
          dia +
          "&s=Soccer"
        );

      const lista =
        data.events || [];

      const achado =
        lista.find(
          ev =>
            eventoCombina(
              ev,
              casa,
              fora
            )
        );

      if(achado)
        return achado;

    }catch(e){}

  }

  return null;

}
