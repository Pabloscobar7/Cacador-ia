<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Caçador IA V2.2</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080d1c;
    color:#fff;
}

header{
    text-align:center;
    padding:22px 14px 12px;
}

header h1{
    margin:0;
    font-size:29px;
}

header p{
    margin:8px 0 0;
    color:#aeb8cf;
    font-size:15px;
}

.container{
    width:94%;
    max-width:720px;
    margin:auto;
}

.status{
    padding:13px;
    border-radius:14px;
    text-align:center;
    margin:14px 0;
    background:#3d1b20;
    color:#ffadb5;
}

.status.ok{
    background:#064b30;
    color:#63e5a5;
}

.card{
    background:#11182d;
    border-radius:23px;
    padding:21px;
    margin:16px 0;
    box-shadow:0 7px 22px #0005;
}

h2{
    margin-top:0;
}

input,
select{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:2px solid #35415f;
    background:#0c1325;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#1878ed;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:14px;
    margin-top:10px;
    background:#1878ed;
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

button.secondary{
    background:#29334d;
}

button.green{
    background:#087b4b;
}

button.orange{
    background:#9c5a08;
}

button.red{
    background:#8a2631;
}

button:active{
    transform:scale(.98);
}

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin:15px 0;
}

.menu button{
    margin:0;
    padding:13px 5px;
    font-size:14px;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.message{
    padding:14px;
    border-radius:13px;
    background:#0c1325;
    margin-top:13px;
    line-height:1.55;
}

.oktext{
    color:#5ee5a4;
}

.badtext{
    color:#ff7f8a;
}

.yellow{
    color:#ffd166;
}

.blue{
    color:#65a7ff;
}

.small{
    font-size:13px;
    color:#9faac1;
}

.game{
    background:#0d1428;
    border:1px solid #303a5c;
    border-radius:18px;
    padding:17px;
    margin-top:13px;
}

.game h3{
    margin:0 0 10px;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:18px;
    font-weight:bold;
    margin-top:5px;
}

.pending{
    background:#594800;
    color:#ffe36b;
}

.win{
    background:#075d3b;
    color:#67efb0;
}

.loss{
    background:#681923;
    color:#ff929c;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.stat{
    background:#0d1428;
    border:1px solid #303a5c;
    border-radius:14px;
    padding:12px 5px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:21px;
    margin-bottom:4px;
}

hr{
    border:0;
    border-top:1px solid #2b3450;
    margin:18px 0;
}

.loading{
    text-align:center;
    padding:18px;
    color:#9fb8dd;
}

.hidden{
    display:none;
}

footer{
    text-align:center;
    color:#68748c;
    padding:25px 10px 40px;
    font-size:12px;
}

@media(max-width:480px){

    header h1{
        font-size:25px;
    }

    .card{
        padding:17px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>


<body>

<header>

<h1>🎯 Caçador IA V2.2</h1>

<p>
Análise e comparação de informações de jogos
</p>

</header>


<div class="container">


<!-- STATUS FIREBASE -->

<div id="firebaseStatus" class="status">

☁️ Firebase: conectando...

</div>


<!-- MENU PRINCIPAL -->

<div class="menu">

<button onclick="mostrarAba('pesquisa')">
🔎 Pesquisar
</button>

<button onclick="mostrarAba('palpites')">
🔮 Palpites
</button>

<button onclick="mostrarAba('historico')">
📋 Histórico
</button>

</div>



<!-- =====================================================
     PESQUISA
===================================================== -->

<section id="pesquisa" class="section active">

<div class="card">

<h2>🔎 Pesquisar jogo</h2>

<input
id="gameInput"
placeholder="Ex.: Áustria vs Israel"
>

<button onclick="procurarJogo()">

🔭 Procurar jogo

</button>

<div id="searchMessage"></div>

</div>



<!-- JOGO ENCONTRADO -->

<div id="gameCard" class="card hidden">

<h2>
⚽ Jogo encontrado
</h2>

<div id="gameInfo"></div>

<hr>


<h2>
🧠 Leitura do Caçador
</h2>

<div id="analysis"></div>

<hr>


<h2>
🔮 Guardar palpite
</h2>


<label>
Tipo de palpite
</label>


<select
id="predictionType"
onchange="atualizarOpcoesPalpite()"
>

<option value="1X2">
Resultado — Casa/Empate/Fora
</option>

<option value="OVER15">
Mais de 1.5 gols
</option>

<option value="OVER25">
Mais de 2.5 gols
</option>

<option value="UNDER35">
Menos de 3.5 gols
</option>

<option value="BTTS">
Ambas marcam
</option>

</select>


<label>
Palpite
</label>


<select id="predictionValue">

</select>


<button
class="green"
onclick="guardarPalpite()"
>

💾 Guardar palpite

</button>


<div id="saveMessage"></div>

</div>

</section>



<!-- =====================================================
     PALPITES
===================================================== -->

<section id="palpites" class="section">

<div class="card">

<h2>
